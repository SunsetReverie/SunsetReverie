<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb88c"/>
      <stop offset="0.45" stop-color="#ff7e5f"/>
      <stop offset="0.75" stop-color="#e85a71"/>
      <stop offset="1" stop-color="#a06cd5"/>
    </linearGradient>
  </defs>
  <!-- 落日 -->
  <circle cx="16" cy="13" r="7" fill="url(#sunset)"/>
  <!-- 地平线 -->
  <rect x="3" y="21" width="26" height="2.5" rx="1.25" fill="url(#sunset)" opacity="0.85"/>
  <!-- 下方两道渐隐的余晖 -->
  <rect x="7" y="26" width="18" height="2" rx="1" fill="url(#sunset)" opacity="0.45"/>
  <rect x="11" y="30" width="10" height="1.6" rx="0.8" fill="url(#sunset)" opacity="0.22"/>
