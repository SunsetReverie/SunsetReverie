<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="夕梦框架 SunsetReverie —— 面向纯 API 场景的 PHP 8.3+ 轻量级通用框架产品规划文档">
<meta name="author" content="SunsetReverie">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<style>
:root{
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --bg:#ffffff;
  --bg-subtle:#fbfbfd;
  --bg-inset:#f5f6f8;
  --bg-code:#f6f7fa;
  --code-bar:#eff1f5;
  --border:#e4e6ec;
  --border-soft:#eef0f4;
  --text:#14161c;
  --text-2:#575e6d;
  --text-3:#8e95a3;
  --accent:#5b53ff;
  --accent-ink:#4a42e0;
  --accent-soft:#f0efff;
  --shadow:0 1px 2px rgba(17,24,39,.04),0 12px 28px -18px rgba(17,24,39,.18);
  --sidebar:284px;
  --kw:#7c3aed; --str:#0e7c66; --com:#9aa3ae; --num:#b45309; --var:#2563eb;
}
html[data-theme="dark"]{
  --bg:#0b0c0f;
  --bg-subtle:#101116;
  --bg-inset:#17181e;
  --bg-code:#111216;
  --code-bar:#17181d;
  --border:#23252c;
  --border-soft:#1a1c21;
  --text:#e9ebf0;
  --text-2:#a1a8b6;
  --text-3:#6f7686;
  --accent:#9a94ff;
  --accent-ink:#b6b1ff;
  --accent-soft:#1d1b33;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 16px 36px -20px rgba(0,0,0,.7);
  --kw:#c4b5fd; --str:#5eead4; --com:#6b7280; --num:#fbbf24; --var:#93c5fd;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15.5px/1.72 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:.004em;
}
::selection{background:var(--accent-soft);color:var(--accent-ink)}
#progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:100;transition:width .08s linear}

/* ---------- 侧栏 ---------- */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sidebar);z-index:40;
  display:flex;flex-direction:column;background:var(--bg-subtle);border-right:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:11px;padding:22px 20px 16px}
.mark{
  width:30px;height:30px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),#8b7cff);color:#fff;font-size:13.5px;font-weight:700;
  box-shadow:0 6px 16px -8px rgba(91,83,255,.9);
}
html[data-theme="dark"] .mark{color:#0b0c0f}
.brand-name{font-size:14.5px;font-weight:650;letter-spacing:-.01em;line-height:1.3}
.brand-sub{font-size:10.8px;color:var(--text-3);letter-spacing:.12em;margin-top:2px}
.search{padding:0 16px 10px}
.search input{
  width:100%;height:34px;padding:0 11px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font:inherit;font-size:12.8px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.search input::placeholder{color:var(--text-3)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
nav{flex:1;overflow-y:auto;padding:2px 10px 18px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
nav::-webkit-scrollbar{width:5px}
nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
nav a{
  display:block;padding:5px 10px;margin:1px 0;border-radius:7px;text-decoration:none;
  color:var(--text-3);font-size:12.7px;line-height:1.55;transition:background .12s,color .12s;
}
nav a.lvl2{color:var(--text-2);font-weight:600;font-size:13px;margin-top:12px}
nav a.lvl3{padding-left:22px;font-size:12.3px}
nav a:hover{background:var(--bg-inset);color:var(--text)}
nav a.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
nav a.hide{display:none}
.side-foot{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:11px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3);
}
.theme-btn{
  display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:7px;cursor:pointer;
  border:1px solid var(--border);background:var(--bg);color:var(--text-2);font:inherit;font-size:11.4px;
  transition:color .14s,border-color .14s;
}
.theme-btn:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- 主区 ---------- */
main{margin-left:var(--sidebar);padding-bottom:120px}
.wrap{max-width:900px;margin:0 auto;padding:0 44px}
.page-head{padding:62px 0 26px;border-bottom:1px solid var(--border)}
.eyebrow{font-size:11px;font-weight:650;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}
.page-head h1{margin:15px 0 0;font-size:38px;line-height:1.18;font-weight:700;letter-spacing:-.03em}
.page-head h1 em{font-style:normal;color:var(--accent)}
.lede{margin:15px 0 0;font-size:15px;line-height:1.65;color:var(--text-2);max-width:60ch}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px 13px;margin-top:22px;font-size:12.4px;color:var(--text-3)}
.pill{
  display:inline-flex;align-items:center;height:23px;padding:0 8px;border-radius:6px;
  border:1px solid rgba(91,83,255,.26);color:var(--accent-ink);
  font-size:11.4px;font-weight:650;letter-spacing:.02em;
}
html[data-theme="dark"] .pill{border-color:rgba(154,148,255,.32)}
.sep{width:3px;height:3px;border-radius:50%;background:var(--border);display:inline-block}

/* ---------- 正文 ---------- */
article{padding-top:14px}
#content > h1:first-child{display:none}
article h1,article h2,article h3,article h4{scroll-margin-top:26px}
article h2{
  margin:56px 0 16px;padding-top:32px;border-top:1px solid var(--border-soft);
  font-size:23px;font-weight:680;line-height:1.35;letter-spacing:-.022em;
}
article h2:first-of-type{border-top:0;padding-top:6px;margin-top:34px}
article h3{margin:36px 0 10px;font-size:17px;font-weight:640;line-height:1.45;letter-spacing:-.012em}
article h4{position:relative;margin:28px 0 8px;padding-left:12px;font-size:14.5px;font-weight:640;color:var(--text)}
article h4::before{
  content:"";position:absolute;left:1px;top:.62em;width:4px;height:4px;
  border-radius:50%;background:var(--accent);opacity:.75;
}
p{margin:13px 0}
strong{font-weight:650}
em{font-style:italic}
a{color:var(--accent-ink);text-decoration:none;transition:color .12s}
a:hover{text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
ul,ol{margin:13px 0;padding-left:22px}
li{margin:6px 0}
li::marker{color:var(--text-3)}
li.sub{margin-left:20px}
li.resume{margin-top:10px}
.task{font-family:var(--mono);color:var(--accent-ink)}
hr{border:0;height:1px;background:var(--border-soft);margin:44px 0}
blockquote{
  margin:20px 0;padding:14px 18px;border-left:2px solid var(--accent);border-radius:0 10px 10px 0;
  background:var(--bg-subtle);color:var(--text-2);font-size:14.6px;
}
blockquote p{margin:6px 0}
blockquote p:first-child{margin-top:0}
blockquote p:last-child{margin-bottom:0}
code.inline{
  font-family:var(--mono);font-size:.855em;padding:1.5px 6px;border-radius:5px;
  background:var(--bg-inset);border:1px solid var(--border-soft);color:var(--text);
  white-space:nowrap;font-variant-ligatures:none;
}

/* ---------- 代码块 ---------- */
.code{margin:16px 0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg-code)}
.code-bar{
  display:flex;align-items:center;justify-content:space-between;
  height:33px;padding:0 8px 0 14px;border-bottom:1px solid var(--border);background:var(--code-bar);
}
.code-lang{font-size:10.4px;font-weight:650;letter-spacing:.11em;color:var(--text-3)}
.copy{
  border:1px solid transparent;background:transparent;color:var(--text-3);
  font:inherit;font-size:11.4px;padding:2px 8px;border-radius:6px;cursor:pointer;
  opacity:0;transition:opacity .14s,background .14s,color .14s;
}
.code:hover .copy,.copy:focus-visible{opacity:1}
.copy:hover{background:var(--bg-inset);color:var(--text)}
@media(hover:none){.copy{opacity:1}}
.code pre{margin:0;padding:15px 16px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.code pre::-webkit-scrollbar{height:8px}
.code pre::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
.code code{
  font-family:var(--mono);font-size:12.7px;line-height:1.75;white-space:pre;tab-size:4;
  color:var(--text);font-variant-ligatures:none;
}
.c-kw{color:var(--kw)}
.c-str{color:var(--str)}
.c-com{color:var(--com);font-style:italic}
.c-num{color:var(--num)}
.c-var{color:var(--var)}
.c-lit{color:var(--num)}

/* ---------- 表格 ---------- */
.tablewrap{
  margin:18px 0;overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--bg);
}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:13.3px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border-soft)}
th{
  background:var(--bg-subtle);color:var(--text-2);font-size:12.1px;font-weight:600;
  letter-spacing:.01em;white-space:nowrap;
}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--bg-subtle)}
td:first-child{min-width:88px}
td code.inline,th code.inline{font-size:12.1px}

/* ---------- 移动端 ---------- */
.topbar{
  display:none;position:fixed;top:0;left:0;right:0;height:52px;z-index:60;
  align-items:center;gap:10px;padding:0 12px;
  background:var(--bg);border-bottom:1px solid var(--border);
}
.topbar-title{flex:1;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.icon-btn{
  width:34px;height:34px;display:grid;place-items:center;border-radius:9px;cursor:pointer;
  border:1px solid var(--border);background:var(--bg);color:var(--text-2);font:inherit;font-size:15px;
}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
@media(max-width:1080px){
  .sidebar{left:calc(-1 * var(--sidebar) - 2px);transition:left .22s ease}
  body.nav-open .sidebar{left:0;box-shadow:0 0 40px rgba(17,24,39,.14)}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(17,24,39,.32);z-index:35}
  main{margin-left:0}
  .wrap{padding:0 20px}
  .topbar{display:flex}
  .page-head{padding-top:78px}
  .page-head h1{font-size:29px}
}
@media(max-width:560px){
  .sep{display:none}
  .page-head h1{font-size:25px}
  .page-head{padding-bottom:20px}
  article h2{font-size:20.5px}
}
@media print{
  .sidebar,#progress,.copy,.topbar{display:none}
  main{margin:0}
  .wrap{max-width:none;padding:0}
  body{background:#fff;color:#000}
  .code,.tablewrap{break-inside:avoid}
}
</style>
</head>
<body>
<div id="progress"></div>

<div class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="打开目录">☰</button>
  <span class="topbar-title">夕梦框架 · 产品规划</span>
  <button class="icon-btn" id="themeTop" aria-label="切换主题">◐</button>
</div>

<aside class="sidebar">
  <div class="brand">
    <div class="mark">夕</div>
    <div>
      <div class="brand-name">夕梦框架</div>
      <div class="brand-sub">SUNSETREVERIE</div>
    </div>
  </div>
  <div class="search"><input id="q" type="search" placeholder="搜索章节…" autocomplete="off" aria-label="搜索章节"></div>
  <nav id="toc" aria-label="文档目录">
{{NAV}}
  </nav>
  <div class="side-foot">
    <span>{{VERSION}} · PHP 8.3+</span>
    <button class="theme-btn" id="theme" aria-label="切换深浅色">◐ 主题</button>
  </div>
</aside>

<main>
  <div class="wrap">
    <header class="page-head">
      <div class="eyebrow">Product Planning Document</div>
      <h1>夕梦框架 <em>SunsetReverie</em></h1>
      <p class="lede">面向纯 API（前后端分离）场景的 PHP 8.3+ 轻量级通用框架。微内核、组件化、核心零 Composer 依赖，一套业务内核支撑后台 / 前台 / App / 小程序四套接口。</p>
      <div class="meta">
        <span class="pill">{{VERSION}}</span>
        <span>{{DATE}}</span>
        <span class="sep"></span>
        <span>PHP 8.3+</span>
        <span class="sep"></span>
        <span>MySQL · PostgreSQL · SQLite</span>
        <span class="sep"></span>
        <span>File · APCu · Redis</span>
      </div>
    </header>
    <article id="content">
{{CONTENT}}
    </article>
  </div>
</main>

<script>
const bar = document.getElementById('progress');
addEventListener('scroll', () => {
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0).toFixed(2) + '%';
}, { passive: true });

const links = Array.from(document.querySelectorAll('#toc a'));
const byId = new Map(links.map(a => [a.getAttribute('href').slice(1), a]));
const heads = Array.from(document.querySelectorAll('article h2, article h3'));

const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    links.forEach(l => l.classList.remove('active'));
    const a = byId.get(e.target.id);
    if (a) {
      a.classList.add('active');
      const box = a.closest('nav');
      const top = a.offsetTop - box.clientHeight / 2;
      box.scrollTo({ top, behavior: 'smooth' });
    }
  });
}, { rootMargin: '0px 0px -76% 0px', threshold: 0 });
heads.forEach(h => io.observe(h));

const q = document.getElementById('q');
if (q) {
  q.addEventListener('input', () => {
    const v = q.value.trim().toLowerCase();
    links.forEach(a => {
      a.classList.toggle('hide', !!v && !(a.dataset.text || '').includes(v));
    });
  });
}

document.querySelectorAll('.code').forEach(box => {
  const btn = box.querySelector('.copy');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    const text = box.querySelector('code').innerText;
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = '已复制';
    } catch (e) {
      btn.textContent = '复制失败';
    }
    setTimeout(() => { btn.textContent = '复制'; }, 1400);
  });
});

const themeBtns = [document.getElementById('theme'), document.getElementById('themeTop')];
const applyTheme = t => {
  document.documentElement.dataset.theme = t;
  localStorage.setItem('sr-doc-theme', t);
  const label = t === 'dark' ? '☀ 主题' : '◐ 主题';
  if (themeBtns[0]) themeBtns[0].textContent = label;
  if (themeBtns[1]) themeBtns[1].textContent = t === 'dark' ? '☀' : '◐';
};
const saved = localStorage.getItem('sr-doc-theme');
applyTheme(saved || 'light');
themeBtns.forEach(b => b && b.addEventListener('click', () => {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
}));

const menuBtn = document.getElementById('menuBtn');
if (menuBtn) menuBtn.addEventListener('click', () => document.body.classList.toggle('nav-open'));
document.querySelectorAll('#toc a').forEach(a => a.addEventListener('click', () => {
  if (innerWidth <= 1080) document.body.classList.remove('nav-open');
}));
</script>
</body>
</html>
